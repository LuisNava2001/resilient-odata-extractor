[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "resilient-odata-extractor"
version = "0.1.0"
description = "Resilient OData extraction with retries, safe paging, an integrity engine that refuses to overclaim completeness, schema discovery and privacy-aware export. Synthetic data only."
readme = "README.md"
requires-python = ">=3.11"
# The extractor, mock server and CLI use the Python standard library only.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
odata-extractor = "odata_extractor.cli:main"

[tool.setuptools]
packages = ["odata_extractor"]

[tool.setuptools.package-data]
odata_extractor = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
